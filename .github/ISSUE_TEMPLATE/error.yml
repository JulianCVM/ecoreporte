name: Error
description: Algo no funciona como dice la documentación.
labels: ['tipo: fix']
body:
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
      description: Lo que ocurre y lo que se esperaba.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      value: |
        1.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión, variante y entorno
      description: La pantalla Perfil muestra versión, variante y entorno.
      placeholder: 0.1.0 · development · local
  - type: textarea
    id: evidencia
    attributes:
      label: Evidencia
      description: Logs, capturas. Sin datos personales ni secretos.
